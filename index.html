    // Create a new combination table from currently selected template tables
    function createCombinationFromSelected() {
      // Only allow if two or more tables selected
      if (selectedTemplateTables.length < 2) {
        alert('Please select at least two reference tables to create a combination.');
        return;
      }
      // Check if combination table already exists (should not show button when exists, but double-check)
      const sortedSel = selectedTemplateTables.slice().sort().join('|');
      let exists = false;
      Object.keys(customTables).forEach(name => {
        const val = customTables[name];
        if (val && val.types && val.types.length === selectedTemplateTables.length) {
          const sortedTypes = val.types.slice().sort().join('|');
          if (sortedTypes === sortedSel) {
            exists = true;
          }
        }
      });
      if (exists) {
        alert('A combination table for these tables already exists.');
        return;
      }
      // Ask user for a name for the combination table
      const name = prompt('Enter a name for the new combination table:', '');
      if (!name) return;
      if (customTables[name]) {
        alert('A table with this name already exists. Please choose another name.');
        return;
      }
      // Gather items for each selected type
      const itemsLists = [];
      for (const type of selectedTemplateTables) {
        if (type.startsWith('custom:')) {
          const tblName = type.substring('custom:'.length);
          const val = customTables[tblName];
          if (!val) {
            itemsLists.push([]);
          } else if (Array.isArray(val)) {
            // simple custom table
            const items = val.map(item => ({ abbr: item.abbr, name: item.name }));
            itemsLists.push(items);
          } else if (val && val.combos) {
            // combination table: use its combos as items
            const items = val.combos.map(combo => ({ abbr: combo.abbr, name: combo.abbr }));
            itemsLists.push(items);
          }
        } else if (type === 'brand') {
          itemsLists.push(brands.map(b => ({ abbr: b.abbr, name: b.name })));
        } else if (type === 'product') {
          itemsLists.push(products.map(p => ({ abbr: p.abbr, name: p.name })));
        } else if (type === 'category') {
          itemsLists.push(categories.map(c => ({ abbr: c.abbr, name: c.name })));
        } else if (type === 'variant') {
          itemsLists.push(variants.map(v => ({ abbr: v.abbr, name: v.name })));
        } else if (type === 'customer') {
          itemsLists.push(customers.map(cu => ({ abbr: cu.abbr, name: cu.name })));
        } else if (type === 'age') {
          itemsLists.push(ages.map(a => ({ abbr: a.abbr, name: a.name })));
        } else if (type === 'location') {
          itemsLists.push(locations.map(l => ({ abbr: l.abbr, name: l.name })));
        } else {
          // unknown type: skip
          itemsLists.push([]);
        }
      }
      // Generate cross product of items
      function cartesian(lists) {
        let result = [[]];
        for (const list of lists) {
          const newResult = [];
          for (const prefix of result) {
            for (const item of list) {
              newResult.push(prefix.concat([item]));
            }
          }
          result = newResult;
        }
        return result;
      }
      const combosArray = cartesian(itemsLists);
      const combos = [];
      const usedCodes = new Set();
      combosArray.forEach((comboItems, idx) => {
        const fullAbbr = comboItems.map(it => it.abbr).join('');
        const code = generateCombinationCode(fullAbbr, idx, usedCodes);
        combos.push({ abbr: code });
      });
      // Save combination table
      customTables[name] = {
        types: selectedTemplateTables.slice(),
        combos: combos
      };
      saveData();
      alert('Combination table "' + name + '" created successfully.');
      // Refresh UI: reference nav, template select options
      renderRefNav();
      renderCombinationGenerator();
      populateTemplateTablesSelect();
      renderSelectedTablesChips();
    }

    // Compute sample SKU and length for a given array of types
    function computeTemplateSample(selectedTypes) {
      // Build sample abbreviations for each type
      const sampleAbbrs = {};
      const sampleNames = {};
      selectedTypes.forEach(type => {
        if (type.startsWith('custom:')) {
          const tableName = type.substring('custom:'.length);
          const tableVal = customTables[tableName];
          if (!tableVal) {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          } else if (Array.isArray(tableVal)) {
            // simple custom table
            const item = tableVal[0];
            if (item) {
              sampleAbbrs[type] = item.abbr;
              sampleNames[type] = item.name;
            } else {
              sampleAbbrs[type] = '';
              sampleNames[type] = '';
            }
          } else if (tableVal && tableVal.combos) {
            // combination table: use first combination entry
            const combo = tableVal.combos[0];
            if (combo) {
              sampleAbbrs[type] = combo.abbr;
              // sampleNames store per type names
              sampleNames[type] = combo.abbr; // names not needed
            } else {
              sampleAbbrs[type] = '';
              sampleNames[type] = '';
            }
          }
        } else if (type === 'brand') {
          if (brands.length > 0) {
            sampleAbbrs[type] = brands[0].abbr;
            sampleNames[type] = brands[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        } else if (type === 'product') {
          if (products.length > 0) {
            sampleAbbrs[type] = products[0].abbr;
            sampleNames[type] = products[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        } else if (type === 'category') {
          if (categories.length > 0) {
            sampleAbbrs[type] = categories[0].abbr;
            sampleNames[type] = categories[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        } else if (type === 'variant') {
          if (variants.length > 0) {
            sampleAbbrs[type] = variants[0].abbr;
            sampleNames[type] = variants[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        } else if (type === 'size') {
          if (sizes.length > 0) {
            sampleAbbrs[type] = sizes[0].abbr;
            sampleNames[type] = sizes[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        } else if (type === 'customer') {
          if (customers.length > 0) {
            sampleAbbrs[type] = customers[0].abbr;
            sampleNames[type] = customers[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        } else if (type === 'age') {
          if (ages.length > 0) {
            sampleAbbrs[type] = ages[0].abbr;
            sampleNames[type] = ages[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        } else if (type === 'location') {
          if (locations.length > 0) {
            sampleAbbrs[type] = locations[0].abbr;
            sampleNames[type] = locations[0].name;
          } else {
            sampleAbbrs[type] = '';
            sampleNames[type] = '';
          }
        }
      });
      // Determine if a saved combination table applies (similar logic to generateSkuForProduct but simplified for sample)
      let bestMatchLength = 0;
      let bestComboTable = null;
      Object.keys(customTables).forEach(name => {
        const val = customTables[name];
        if (val && val.types && val.combos) {
          // ensure the combination table types are subset of selectedTypes
          const isSubset = val.types.every(t => selectedTypes.includes(t));
          if (!isSubset) return;
          // choose table with larger type count
          if (val.types.length > bestMatchLength) {
            bestMatchLength = val.types.length;
            bestComboTable = name;
          }
        }
      });
      let skuString = '';
      let usedTypesSet = new Set();
      if (bestComboTable) {
          // Append the combo abbreviation (use first entry abbreviation) and mark types as used
          const comboVal = customTables[bestComboTable];
          const firstCombo = comboVal.combos[0];
          if (firstCombo) {
            skuString += firstCombo.abbr;
            comboVal.types.forEach(t => usedTypesSet.add(t));
          }
      }
      // Append remaining abbreviations in the order of selectedTypes
      selectedTypes.forEach(type => {
        if (!usedTypesSet.has(type)) {
          skuString += (sampleAbbrs[type] || '');
        }
      });
      // Do not pad zeros to length 12; return the SKU as-is
      const length = skuString.length;
      return { sku: skuString, length: length };
    }

    // Generate sample and suggestions when user clicks generate in template form
    function generateTemplate() {
      const nameInput = document.getElementById('templateName');
      const resultDiv = document.getElementById('templateResult');
      const saveContainer = document.getElementById('saveTemplateContainer');
      if (!nameInput) return;
      // Use selectedTemplateTables instead of multi-select
      const selectedTypes = selectedTemplateTables.slice();
      if (!nameInput.value.trim()) {
        resultDiv.innerHTML = '<div class="message error">Please enter a template name.</div>';
        saveContainer.style.display = 'none';
        return;
      }
      if (selectedTypes.length === 0) {
        resultDiv.innerHTML = '<div class="message error">Please select at least one reference table.</div>';
        saveContainer.style.display = 'none';
        return;
      }
      // Compute sample
      const sampleInfo = computeTemplateSample(selectedTypes);
      let html = '';
      // Build default structure representation: e.g., Brand[2]Customer[1]Variant[2]
      // Determine sample abbreviations for each selected type similar to computeTemplateSample
      // We'll create a structure array and a human-readable string
      const structureParts = [];
      selectedTypes.forEach(t => {
        let abbr = '';
        if (t.startsWith('custom:')) {
          const tblName = t.substring('custom:'.length);
          const val = customTables[tblName];
          if (val && val.combos) {
            // combination table: use length of first abbr
            const combo = val.combos[0];
            if (combo) abbr = combo.abbr;
          } else if (Array.isArray(val)) {
            const first = val[0];
            if (first) abbr = first.abbr;
          }
        } else if (t === 'brand' && brands[0]) abbr = brands[0].abbr;
        else if (t === 'product' && products[0]) abbr = products[0].abbr;
        else if (t === 'category' && categories[0]) abbr = categories[0].abbr;
        else if (t === 'variant' && variants[0]) abbr = variants[0].abbr;
        else if (t === 'customer' && customers[0]) abbr = customers[0].abbr;
        else if (t === 'age' && ages[0]) abbr = ages[0].abbr;
        else if (t === 'location' && locations[0]) abbr = locations[0].abbr;
        const len = abbr ? abbr.length : 0;
        structureParts.push({ type: t, length: len });
      });
      // Compose structure string
      let structureStr = '';
      structureParts.forEach((part, idx) => {
        const typeLabel = part.type.startsWith('custom:') ? part.type.substring('custom:'.length) : part.type;
        structureStr += (typeLabel + '[' + part.length + ']');
        if (idx < structureParts.length - 1) structureStr += '';
      });
      // Store structure for later editing
      window.currentTemplateStructure = structureParts;
      html += '<p><strong>Sample SKU:</strong> ' + (sampleInfo.sku || '(empty)') + '</p>';
      html += '<p><strong>Length:</strong> ' + sampleInfo.length + '</p>';
      html += '<p><strong>Structure:</strong> <span id="structureDisplay">' + structureStr + '</span> <button type="button" id="editStructureBtn" style="margin-left:10px;">Edit</button></p>';
      // Hidden input for editing structure
      html += '<div id="structureEditContainer" style="display:none; margin-top:5px;">' +
              '<input type="text" id="structureInput" style="width:100%;" value="' + structureStr + '" />' +
              '<button type="button" id="saveStructureBtn" style="margin-top:5px;">Save Structure</button>' +
              '</div>';
      // If length exceeds 12, provide suggestions
      if (sampleInfo.length > 12) {
        html += '<p style="color:#c62828;">SKU length exceeds the 12 character limit.</p>';
        const suggestions = [];
        Object.keys(customTables).forEach(name => {
          const val = customTables[name];
          if (val && val.types && val.combos) {
            // must be subset of selectedTypes
            const isSubset = val.types.every(t => selectedTypes.includes(t));
            if (!isSubset) return;
            // calculate candidate length using this combination
            const comboAbbrLen = (val.combos[0] && val.combos[0].abbr) ? val.combos[0].abbr.length : 0;
            let candidateLength = comboAbbrLen;
            selectedTypes.forEach(t => {
              if (!val.types.includes(t)) {
                const info = computeTemplateSample([t]);
                candidateLength += info.length;
              }
            });
            if (candidateLength <= 12) {
              suggestions.push(name + ' (length ' + candidateLength + ')');
            }
          }
        });
        if (suggestions.length > 0) {
          html += '<p><strong>Suggestions:</strong> Use combination table(s) ' + suggestions.join(', ') + ' to reduce length.</p>';
        } else {
          html += '<p><strong>Suggestions:</strong> No existing combination table can reduce the length to 12 or below. Consider creating a new combination in Reference Data.</p>';
        }
      }
      resultDiv.innerHTML = html;
      saveContainer.style.display = 'block';

      // Attach event listeners for editing structure
      const editBtn = document.getElementById('editStructureBtn');
      const structureContainer = document.getElementById('structureEditContainer');
      const structureInput = document.getElementById('structureInput');
      const saveStructureBtn = document.getElementById('saveStructureBtn');
      if (editBtn) {
        editBtn.addEventListener('click', function() {
          // Only allow editing if current sample length is 12 or less
          if (sampleInfo.length > 12) {
            alert('Cannot edit structure: sample length exceeds 12 characters.');
            return;
          }
          structureContainer.style.display = (structureContainer.style.display === 'none' ? 'block' : 'none');
        });
      }
      if (saveStructureBtn) {
        saveStructureBtn.addEventListener('click', function() {
          const newStr = structureInput.value.trim();
          const segRegex = /(\w+)\[(\d+)\]/g;
          let match;
          const newParts = [];
          while ((match = segRegex.exec(newStr)) !== null) {
            const segName = match[1];
            const segLen = parseInt(match[2], 10);
            if (isNaN(segLen) || segLen < 0) continue;
            newParts.push({ name: segName, length: segLen });
          }
          // Extract leftover characters and validate: only hyphens and digits allowed
          const leftover = newStr.replace(segRegex, '');
          if (/[^0-9\-]/.test(leftover)) {
            alert('Only hyphens and digits (e.g., 0) may separate segments.');
            return;
          }
          if (newParts.length !== selectedTypes.length) {
            alert('Structure does not match the selected reference tables.');
            return;
          }
          for (let i = 0; i < newParts.length; i++) {
            const expected = selectedTypes[i];
            const expectedLabel = expected.startsWith('custom:') ? expected.substring('custom:'.length) : expected;
            if (newParts[i].name !== expectedLabel) {
              alert('Structure sequence must follow selected reference tables and names must match.');
              return;
            }
          }
          // Compute total length (segments + separators) and ensure <= 12
          let totalLen = leftover.length;
          newParts.forEach(p => { totalLen += p.length; });
          if (totalLen > 12) {
            alert('Total length must be 12 or less.');
            return;
          }
          // Update structureParts lengths accordingly
          for (let i = 0; i < structureParts.length; i++) {
            structureParts[i].length = newParts[i].length;
          }
          // Update display and hide editor
          document.getElementById('structureDisplay').textContent = newStr;
          structureContainer.style.display = 'none';
          // Helper: fetch abbreviation for given type and length
          const getAbbr = (type, length) => {
            let abbr = '';
            if (type.startsWith('custom:')) {
              const tblName = type.substring('custom:'.length);
              const val = customTables[tblName];
              if (val && val.combos) {
                const combo = val.combos[0];
                if (combo) abbr = combo.abbr;
              } else if (Array.isArray(val) && val[0]) abbr = val[0].abbr;
            } else if (type === 'brand' && brands[0]) abbr = brands[0].abbr;
            else if (type === 'product' && products[0]) abbr = products[0].abbr;
            else if (type === 'category' && categories[0]) abbr = categories[0].abbr;
            else if (type === 'variant' && variants[0]) abbr = variants[0].abbr;
            else if (type === 'size' && sizes[0]) abbr = sizes[0].abbr;
            else if (type === 'customer' && customers[0]) abbr = customers[0].abbr;
            else if (type === 'age' && ages[0]) abbr = ages[0].abbr;
            else if (type === 'location' && locations[0]) abbr = locations[0].abbr;
            return (abbr || '').substring(0, length);
          };
          // Replace each segment with corresponding abbreviation while preserving separators
          let partIndex = 0;
          const newSku = newStr.replace(segRegex, function(fullMatch, segName, segLen) {
            const type = selectedTypes[partIndex];
            const len = newParts[partIndex].length;
            const abbr = getAbbr(type, len);
            partIndex++;
            return abbr;
          });
          const newLen = newSku.length;
          // Build updated result display
          let updatedHtml = '';
          updatedHtml += '<p><strong>Sample SKU:</strong> ' + newSku + '</p>';
          updatedHtml += '<p><strong>Length:</strong> ' + newLen + '</p>';
          updatedHtml += '<p><strong>Structure:</strong> <span id="structureDisplay">' + newStr + '</span> <button type="button" id="editStructureBtn" style="margin-left:10px;">Edit</button></p>';
          updatedHtml += '<div id="structureEditContainer" style="display:none; margin-top:5px;">';
          updatedHtml += '<input type="text" id="structureInput" style="width:100%;" value="' + newStr + '" />';
          updatedHtml += '<button type="button" id="saveStructureBtn" style="margin-top:5px;">Save Structure</button>';
          updatedHtml += '</div>';
          resultDiv.innerHTML = updatedHtml;
          // Update sampleInfo for closure
          sampleInfo.sku = newSku;
          sampleInfo.length = newLen;
          // Reattach edit/save handlers
          const rebind = function() {
            const edBtn = document.getElementById('editStructureBtn');
            const structCont = document.getElementById('structureEditContainer');
            const saveBtn2 = document.getElementById('saveStructureBtn');
            if (edBtn) {
              edBtn.addEventListener('click', function() {
                if (sampleInfo.length > 12) {
                  alert('Cannot edit structure: sample length exceeds 12 characters.');
                  return;
                }
                structCont.style.display = (structCont.style.display === 'none' ? 'block' : 'none');
              });
            }
            if (saveBtn2) {
              saveBtn2.onclick = null;
              saveBtn2.addEventListener('click', function() {
                // trigger the original save handler again
                saveStructureBtn.click();
              });
            }
          };
          rebind();
        });
      }
    }

    // Save the template
    function saveTemplate() {
      const nameInput = document.getElementById('templateName');
      const resultDiv = document.getElementById('templateResult');
      if (!nameInput) return;
      const name = nameInput.value.trim();
      const selectedTypes = selectedTemplateTables.slice();
      if (!name) {
        resultDiv.innerHTML = '<div class="message error">Please enter a template name.</div>';
        return;
      }
      if (skuTemplates.some(tpl => tpl.name.toLowerCase() === name.toLowerCase())) {
        resultDiv.innerHTML = '<div class="message error">A template with this name already exists.</div>';
        return;
      }
      if (selectedTypes.length === 0) {
        resultDiv.innerHTML = '<div class="message error">Please select at least one reference table.</div>';
        return;
      }
      skuTemplates.push({ name: name, types: selectedTypes });
      saveData();
      renderTemplateList();
      // Clear form and hide it
      nameInput.value = '';
      // Reset selected tables and UI
      selectedTemplateTables = [];
      renderSelectedTablesChips();
      populateTemplateTablesSelect();
      document.getElementById('templateResult').innerHTML = '';
      document.getElementById('templateForm').style.display = 'none';
      document.getElementById('saveTemplateContainer').style.display = 'none';
    }

    // Remove a template by index
    function removeTemplate(index) {
      skuTemplates.splice(index, 1);
      saveData();
      renderTemplateList();
    }

    // Setup events for template creation
    function setupTemplateEvents() {
      const createBtn = document.getElementById('createTemplateBtn');
      if (createBtn) {
        createBtn.addEventListener('click', function() {
          // Always show the form when clicking create template
          const form = document.getElementById('templateForm');
          if (!form) return;
          form.style.display = 'block';
          // Reset selected tables
          selectedTemplateTables = [];
          renderSelectedTablesChips();
          // Populate dropdown each time to reflect latest tables
          populateTemplateTablesSelect();
        });
      }
      const genBtn = document.getElementById('generateTemplateBtn');
      if (genBtn) {
        genBtn.addEventListener('click', generateTemplate);
      }
      const saveBtn = document.getElementById('saveTemplateBtn');
      if (saveBtn) {
        saveBtn.addEventListener('click', saveTemplate);
      }
      // When user selects a table in dropdown, add it automatically
      const templateTablesSelect = document.getElementById('templateTablesSelect');
      if (templateTablesSelect) {
        templateTablesSelect.addEventListener('change', function() {
          const value = templateTablesSelect.value;
          if (!value) return;
          // Only add if not already selected and no overlap
          if (!selectedTemplateTables.includes(value)) {
            if (!canAddTableToTemplate(value)) {
              const resultDiv = document.getElementById('templateResult');
              if (resultDiv) {
                resultDiv.innerHTML = '<div class="message error">This selection overlaps with an existing table or combination.</div>';
              }
              // Reset selection to placeholder
              templateTablesSelect.selectedIndex = 0;
              return;
            }
            selectedTemplateTables.push(value);
            // Reset select value to placeholder to show next time
            templateTablesSelect.selectedIndex = 0;
            renderSelectedTablesChips();
            populateTemplateTablesSelect();
          }
        });
      }
      // Create combination table from current selection
      const createCombBtn = document.getElementById('createCombinationFromTemplateBtn');
      if (createCombBtn) {
        createCombBtn.addEventListener('click', createCombinationFromSelected);
      }
    }

    // Initialize app
    document.addEventListener('DOMContentLoaded', function() {
      loadData();
      populateNewProductForm();
      // Attach change handler to SKU template select to update visible fields
      const skuTemplateSelect = document.getElementById('npSkuTemplate');
      if (skuTemplateSelect) {
        skuTemplateSelect.addEventListener('change', function() {
          updateFieldVisibility();
        });
      }
      // After populating form, set up dual list controls
      setupDualLists();
      renderProductMasterTable();
      setupTabs();
      // Render navigation and combination generator
      renderRefNav();
      renderCombinationGenerator();
      // Set up add table button
      const addTableBtn = document.getElementById('addTableBtn');
      if (addTableBtn) {
        addTableBtn.addEventListener('click', function() {
          const input = document.getElementById('newTableName');
          const name = input ? input.value.trim() : '';
          if (name) {
            addReferenceTable(name);
            input.value = '';
          }
        });
      }

      // Render template list and set up template events
      renderTemplateList();
      setupTemplateEvents();
      // Populate the template tables select and render chips for template form
      populateTemplateTablesSelect();
      renderSelectedTablesChips();
    });
  </script>
</body>
</html>
